<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORM PENDAFTARAN</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: 'Poppins', sans-serif;
    }

    body{
      height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(-45deg,#001f54,#0059ff,#00b7ff,#004aad);
      background-size:500% 500%;
      animation: bgGerak 12s ease infinite;
      position:relative;
    }

    @keyframes bgGerak{
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }

    /* BACKGROUND BERGERAK */
    .bg-item{
      position:absolute;
      color:rgba(255,255,255,0.08);
      font-weight:bold;
      white-space:nowrap;
      animation: jalan linear infinite;
      user-select:none;
    }

    @keyframes jalan{
      from{
        transform:translateX(-120%);
      }
      to{
        transform:translateX(120%);
      }
    }

    /* FORM */
    .container{
      width:90%;
      max-width:430px;
      background:rgba(255,255,255,0.12);
      backdrop-filter:blur(15px);
      border-radius:25px;
      padding:30px;
      box-shadow:0 10px 30px rgba(0,0,0,0.3);
      position:relative;
      z-index:10;
    }

    .cat{
      text-align:center;
      font-size:45px;
      animation:kucing 1s infinite alternate;
    }

    @keyframes kucing{
      from{
        transform:rotate(-8deg);
      }
      to{
        transform:rotate(8deg);
      }
    }

    h1{
      text-align:center;
      color:white;
      margin:15px 0 25px;
      text-shadow:0 0 15px rgba(255,255,255,0.5);
    }

    .input-box{
      margin-bottom:18px;
    }

    .input-box label{
      display:block;
      color:white;
      margin-bottom:7px;
      font-weight:600;
    }

    .input-box input,
    .input-box select{
      width:100%;
      padding:13px;
      border:none;
      border-radius:12px;
      outline:none;
      background:rgba(255,255,255,0.2);
      color:white;
      font-size:15px;
    }

.gender-box{
margin-top:20px;
display:flex;
gap:20px;
}

.gender-card{
display:flex;
align-items:center;
gap:12px;
background:rgba(255,255,255,0.15);
padding:14px 18px;
border-radius:18px;
backdrop-filter:blur(10px);
cursor:pointer;
transition:0.3s;
color:white;
font-size:10px;
font-weight:500;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.gender-card:hover{
transform:scale(1.03);
background:rgba(255,255,255,0.22);
}

.gender-card input{
display:none;
}

.custom-radio{
width:25px;
height:25px;
border-radius:50%;
border:3px solid white;
position:relative;
transition:0.3s;
}

.custom-radio::after{
content:'';
position:absolute;
width:10px;
height:10px;
background:white;
border-radius:50%;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(0);
transition:0.3s;
}

.gender-card input:checked + .custom-radio{
background:#00d4ff;
box-shadow:
0 0 10px #00d4ff,
0 0 20px #00d4ff;
}

.gender-card input:checked + .custom-radio::after{
transform:translate(-50%,-50%) scale(1);
}

.gender-card span{
user-select:none;
}
.gender-box{
justify-content:center;
}
    .input-box input::placeholder{
      color:#e2e8f0;
    }

    select option{
      color:black;
    }

    .btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:15px;
      background:white;
      color:#0059ff;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      transform:scale(1.05);
      background:#dbeafe;
    }
  </style>
</head>
<body>
  <!-- FORM -->
  <div class="container">

    <form>

</div>

  </div>

</body>
</html>
